name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code quality
    uses: ./.github/workflows/code-quality.yml

  test-kotlin:
    name: Shared Kotlin
    uses: ./.github/workflows/test-kotlin.yml

  test-ios:
    name: iOS application
    uses: ./.github/workflows/test-ios.yml

  build-unsigned-release:
    name: Unsigned release
    uses: ./.github/workflows/build-unsigned-release.yml
